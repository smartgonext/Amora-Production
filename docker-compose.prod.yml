version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amora-backend
    restart: always
    environment:
      FLASK_CONFIG: prod
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-Smartgonext@4505}
      DB_NAME: ${DB_NAME:-smartgonext_erp}
      SECRET_KEY: ${SECRET_KEY:-amora-bakery-prod-secret-key-2026}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-amora-jwt-secret-key-32-bytes-secure}
    expose:
      - "5000"
    networks:
      - default
      - coolify
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: amora-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - default
      - coolify
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
  coolify:
    external: true
